<!DOCTYPE html>
<html lang="en">
<body>
<form action="http://localhost/bool" method="post">
	<label>Flag<input name="flag" type="checkbox" value="on"></label>
	<button type="submit">Submit</button>
</form>
<hr />
<form action="http://localhost/bool" method="post">
	<label>On<input checked name="flag" type="radio" value="on"></label>
	<label>Off<input name="flag" type="radio" value="off"></label>
	<button type="submit">Submit</button>
</form>
</body>
</html>
